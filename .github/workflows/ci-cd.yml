name: Vastu Ritam CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: TypeScript & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Compiler Check
        run: npm run lint

  unit-and-api-tests:
    name: Unit & API Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-key-2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Execute Unit & API Test Suite
        run: npm test

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: unit-and-api-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vastu-ritam-dist
          path: dist/
          retention-days: 7

  docker-deploy-readiness:
    name: Docker & Compose Readiness Check
    runs-on: ubuntu-latest
    needs: build-verification
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Production Docker Image
        run: docker build --target production -t vastu-ritam:latest .
